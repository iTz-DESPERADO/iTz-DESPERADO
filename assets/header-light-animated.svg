<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Gamal Khaled — Backend .NET Developer</title>
  <desc id="desc">Desperado. An ivory and navy identity with an animated geometric D monogram, a slow orbit, and a soft gold light sweep. APIs, business systems, and thoughtful software design.</desc>
  <style>
    .banner-orbit {
      transform-box: view-box;
      transform-origin: 938px 151px;
      animation: banner-orbit 28s linear infinite;
    }
    .banner-pulse {
      transform-box: view-box;
      transform-origin: 938px 151px;
      animation: banner-breathe 5s ease-in-out infinite;
    }
    .banner-trace {
      stroke-dasharray: 66 414;
      animation: banner-trace 9s linear infinite;
    }
    .banner-signal {
      opacity: 0;
      animation: banner-signal 8s cubic-bezier(.4, 0, .2, 1) infinite;
      animation-delay: -2s;
    }
    .banner-accent { animation: banner-accent 5s ease-in-out infinite; }
    @keyframes banner-orbit { to { transform: rotate(360deg); } }
    @keyframes banner-breathe {
      0%, 100% { transform: scale(.96); opacity: .12; }
      50% { transform: scale(1.035); opacity: .38; }
    }
    @keyframes banner-trace { to { stroke-dashoffset: -480; } }
    @keyframes banner-signal {
      0% { transform: translateX(0); opacity: 0; }
      12% { opacity: .9; }
      72% { opacity: .9; }
      88%, 100% { transform: translateX(908px); opacity: 0; }
    }
    @keyframes banner-accent {
      0%, 100% { opacity: .6; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .banner-orbit, .banner-pulse, .banner-trace,
      .banner-signal, .banner-accent { animation: none; }
      .banner-pulse { opacity: .18; }
      .banner-trace, .banner-signal { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1120" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F6F1"/><stop offset="1" stop-color="#F0EDE6"/>
    </linearGradient>
    <linearGradient id="gold" x1="824" y1="90" x2="1004" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A58549"/><stop offset="1" stop-color="#74582E"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#78869D" fill-opacity="0.18"/>
    </pattern>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8B6C38" stop-opacity="0"/>
      <stop offset=".55" stop-color="#8B6C38"/>
      <stop offset="1" stop-color="#8B6C38" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="1119" height="339" rx="18" fill="url(#background)" stroke="#E0DDD5"/>
  <path d="M800 1H1102C1111.39 1 1119 8.611 1119 18V322C1119 331.389 1111.39 339 1102 339H800V1Z" fill="url(#grid)"/>
  <rect class="banner-accent" x="56" y="52" width="24" height="3" rx="1.5" fill="#8B6C38"/>
  <text x="94" y="58" fill="#8B6C38" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="3.5">DESPERADO</text>
  <text x="56" y="146" fill="#172337" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2.5">Gamal Khaled<tspan fill="#99763F">.</tspan></text>
  <text x="58" y="189" fill="#8B6C38" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" letter-spacing="0.3">Backend .NET Developer</text>
  <text x="58" y="228" fill="#596579" font-family="Arial, Helvetica, sans-serif" font-size="16">APIs, business systems, and thoughtful software design.</text>
  <path d="M58 267H1062" stroke="#D8D7D2"/>
  <path class="banner-signal" d="M58 267H154" stroke="url(#signal)" stroke-width="2" stroke-linecap="round"/>
  <text x="58" y="304" fill="#516078" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="2.2">C#</text>
  <circle cx="102" cy="300" r="1.5" fill="#999D9F"/>
  <text x="120" y="304" fill="#516078" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="2.2">ASP.NET CORE</text>
  <circle cx="254" cy="300" r="1.5" fill="#999D9F"/>
  <text x="272" y="304" fill="#516078" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="2.2">SQL SERVER</text>
  <text x="1062" y="304" text-anchor="end" fill="#7B807F" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.5">DESIGN / BUILD / REFINE</text>
  <g>
    <circle cx="938" cy="151" r="92" stroke="#D0CDC5"/>
    <circle class="banner-pulse" cx="938" cy="151" r="102" stroke="#8B6C38" stroke-width="1"/>
    <g class="banner-orbit">
      <circle cx="938" cy="151" r="109" stroke="#D2CEC5" stroke-dasharray="2 9"/>
      <path d="M922 43A109 109 0 0 1 952 43" stroke="#8B6C38" stroke-opacity=".45" stroke-linecap="round"/>
      <circle cx="938" cy="42" r="2.5" fill="#8B6C38"/>
    </g>
    <path d="M886 94H930C970 94 994 115 994 151C994 187 970 208 930 208H886V94Z" stroke="url(#gold)" stroke-width="2"/>
    <path class="banner-trace" d="M886 94H930C970 94 994 115 994 151C994 187 970 208 930 208H886V94Z" pathLength="480" stroke="#8B6C38" stroke-width="3" stroke-linecap="round"/>
    <path d="M902 110H929C960 110 978 124 978 151C978 178 960 192 929 192H902V110Z" stroke="#8B6C38" stroke-opacity="0.4"/>
    <path d="M918 126H928C948 126 962 133 962 151C962 169 948 176 928 176H918V126Z" fill="url(#gold)"/>
    <rect x="883" y="91" width="6" height="6" fill="#8B6C38"/>
    <rect x="883" y="205" width="6" height="6" fill="#8B6C38"/>
    <path d="M829 151H852M1024 151H1047" stroke="#9AA0A4" stroke-width="1"/>
    <circle cx="1047" cy="151" r="3" fill="#8B6C38"/>
  </g>
</svg>
