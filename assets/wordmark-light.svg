<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="154" viewBox="0 0 1120 154" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">DESPERADO</title>
  <desc id="desc">A muted bronze wordmark with a soft light passing through the letters.</desc>
  <style>
    .wordmark-letters {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 86px;
      font-weight: 700;
      letter-spacing: 12px;
      text-anchor: middle;
    }
    .wordmark-sheen {
      opacity: 0;
      animation: wordmark-shimmer 7.5s cubic-bezier(.35, 0, .25, 1) infinite;
      animation-delay: -1.8s;
    }
    @keyframes wordmark-shimmer {
      0%, 8% { transform: translateX(0); opacity: 0; }
      20% { opacity: .85; }
      65% { opacity: .85; }
      82%, 100% { transform: translateX(1480px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wordmark-sheen { animation: none; opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="letter-tone" x1="560" y1="40" x2="560" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#907F65"/>
      <stop offset=".55" stop-color="#7D6D55"/>
      <stop offset="1" stop-color="#695A44"/>
    </linearGradient>
    <linearGradient id="soft-light" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#D6B67C" stop-opacity="0"/>
      <stop offset=".35" stop-color="#D6B67C" stop-opacity=".12"/>
      <stop offset=".53" stop-color="#D6B67C" stop-opacity=".95"/>
      <stop offset=".7" stop-color="#D6B67C" stop-opacity=".12"/>
      <stop offset="1" stop-color="#D6B67C" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="letter-shapes">
      <text class="wordmark-letters" x="566" y="107">DESPERADO</text>
    </clipPath>
  </defs>
  <text class="wordmark-letters" x="566" y="107" fill="url(#letter-tone)">DESPERADO</text>
  <g clip-path="url(#letter-shapes)">
    <g class="wordmark-sheen">
      <rect x="-240" y="12" width="240" height="124" transform="skewX(-16)" fill="url(#soft-light)"/>
    </g>
  </g>
  <path d="M528 137H592" stroke="#7D6D55" stroke-opacity=".3" stroke-linecap="round"/>
</svg>
